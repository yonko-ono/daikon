# Yama ptrace scope - Restrict ptrace() usage
# 0: classic ptrace permissions
# 1: restricted ptrace (only parent processes can ptrace)
# 2: admin-only (requires CAP_SYS_PTRACE)
# 3: no ptrace
kernel.yama.ptrace_scope = 1

# BPF JIT hardening
# 0: no hardening
# 1: enable hardening for unprivileged users
# 2: enable hardening for all users
net.core.bpf_jit_harden = 2

# Restrict dmesg to root only
kernel.dmesg_restrict = 1

# Restrict kernel pointer exposure
kernel.kptr_restrict = 2

# Enable randomized memory layout
kernel.randomize_va_space = 2

# Disable kexec (allows replacing current kernel)
kernel.kexec_load_disabled = 1

# Restrict perf events to root only
kernel.perf_event_paranoid = 3

# Disable unprivileged BPF
kernel.unprivileged_bpf_disabled = 1

# Restrict userfaultfd
vm.unprivileged_userfaultfd = 0

# Harder symlink and hardlink protections
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Network security
# IP spoofing protection
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Ignore ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Ignore send redirects
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Disable source packet routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# SYN flood protection
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_syn_retries = 5
net.ipv4.tcp_synack_retries = 2

# TCP timestamps
net.ipv4.tcp_timestamps = 1

# Ignore ICMP echo requests
net.ipv4.icmp_echo_ignore_all = 1
net.ipv6.icmp_echo_ignore_all = 1

# Ignore ICMP broadcasts
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Log martian packets
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Disable IPv6 if not needed
# net.ipv6.conf.all.disable_ipv6 = 1
# net.ipv6.conf.default.disable_ipv6 = 1

# Increase TCP buffer sizes
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.ipv4.tcp_rmem = 4096 87380 134217728
net.ipv4.tcp_wmem = 4096 65536 134217728

# Tuning for better performance
net.core.netdev_max_backlog = 5000
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_mtu_probing = 1